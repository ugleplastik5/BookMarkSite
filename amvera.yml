meta:
  environment: php
  toolchain:
    name: php
    version: 8.4

build:
  additionalCommands:
    - composer install --no-dev --optimize-autoloader
    - npm install
    - npm run build

run:
  persistenceMount: /data
  containerPort: 8080
  command: php artisan serve --host=0.0.0.0 --port=8080